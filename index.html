<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Problems a business owner / content creators has that you can solve.</title>
<meta name="description" content="Download the guide: problems business owners and content creators have that you can solve with your skills and get paid.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">

<!-- OPTIONAL: Google Analytics 4. Replace G-XXXXXXXXXX with your ID, or delete this block. -->

<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-XXXXXXXXXX');</script>

<style>
  :root{ --bg:#ffffff; --ink:#000000; --muted:#6b6b6b; --line:#e6e6e6; }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    display:grid; place-items:center; padding:clamp(24px,5vw,72px);
  }
  main{
    width:100%; max-width:1120px;
    display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);
    gap:clamp(40px,7vw,104px); align-items:center;
  }
  h1{
    font-weight:500; letter-spacing:-.025em; line-height:1.08;
    font-size:clamp(1.9rem,4.2vw,3.5rem); max-width:18ch;
  }
  .btn{
    display:inline-block; margin-top:40px; padding:16px 30px;
    font-weight:600; font-size:1rem; text-decoration:none;
    color:#fff; background:#000; border-radius:10px;
    transition:transform .15s ease, opacity .15s ease;
  }
  .btn:hover{transform:translateY(-1px);opacity:.88}
  .follow{margin-top:22px;font-size:.95rem;color:var(--muted)}
  .follow a{color:var(--ink);font-weight:500;text-underline-offset:3px}
  a:focus-visible{outline:2px solid #000;outline-offset:3px}

  .doc{justify-self:center;width:min(100%,380px)}
  .doc .page{
    aspect-ratio:3/4; width:100%; border-radius:6px; overflow:hidden;
    background:#fff; border:1px solid var(--line);
    box-shadow:0 30px 60px -28px rgba(0,0,0,.28), 0 2px 6px rgba(0,0,0,.05);
    transform:rotate(1.6deg); transition:transform .4s ease;
    display:grid; place-items:center;
  }
  .doc .page:hover{transform:rotate(0)}
  .doc img{width:100%;height:100%;object-fit:cover;display:block}
  .doc .ph{color:var(--muted);font-size:.9rem;text-align:center;padding:24px;line-height:1.5}

  @media (max-width:820px){
    main{grid-template-columns:1fr}
    .doc{order:-1;width:min(70%,280px);justify-self:start}
    h1{max-width:none}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <section>
    <h1>Problems a business owner / content creators has that you can solve with your skills and get paid</h1>

    <!-- CONFIG: change assets/guide.pdf to your PDF path -->
    <a class="btn" id="dl" href="guide.pdf" download="guide.pdf">Download PDF</a>

    <!-- CONFIG: change the href to your profile (Instagram, LinkedIn, X, YouTube...) -->
    <p class="follow">If it helped you, <a href="https://www.instagram.com/hemakesads" target="_blank" rel="noopener">give me a follow</a>.</p>
  </section>

  <aside class="doc" aria-label="PDF preview">
    <div class="page">
      <!-- Put a PNG of the first page of your PDF at assets/preview.png -->
      <img src="preview.png" alt="Preview of the PDF" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'ph',textContent:'Add your PDF preview at assets/preview.png'}))">
    </div>
  </aside>
</main>

<script>
  // Optional tracking: fires a Google Analytics event when the download is clicked (if GA is enabled above)
  document.getElementById("dl").addEventListener("click", function(){
    try { if (window.gtag) gtag("event", "pdf_download"); } catch (_) {}
  });
</script>
</body>
</html>
